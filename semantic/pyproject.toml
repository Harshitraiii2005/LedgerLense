[project]
name = "ledgerlens-semantic"
version = "0.1.0"
description = "Business-term catalog + embedding retrieval (semantic layer)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
    "sentence-transformers==6.2.0",
    "faiss-cpu==1.15.1",
    "torch==2.15.0",
    "numpy==2.5.4",
]

[project.scripts]
ledgerlens-build-index = "ledgerlens_semantic.index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
