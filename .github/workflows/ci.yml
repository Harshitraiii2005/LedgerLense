name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true
      # --all-packages: the workspace root has no deps of its own; install every service.
      - run: uv sync --frozen --all-packages
      # Couchbase needs fixed ports (its cluster map advertises them), so it runs as a plain
      # container rather than via testcontainers. Used by the risk integration tests.
      - name: Start Couchbase
        run: |
          docker run -d --name couchbase -p 8091-8097:8091-8097 -p 11210:11210 couchbase/server:community-8.0.0
          docker cp services/risk/couchbase-init.sh couchbase:/init.sh
          docker exec -e CB_USER=Administrator -e CB_PASSWORD=ci-password couchbase sh /init.sh
          echo "COUCHBASE_TEST_URL=couchbase://localhost" >> "$GITHUB_ENV"
          echo "COUCHBASE_TEST_PASSWORD=ci-password" >> "$GITHUB_ENV"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy libs/common/src services/*/src
      # GitHub-hosted Ubuntu runners have Docker, so testcontainers integration tests run here too.
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7.0.2
        with: { name: coverage, path: coverage.xml }

  images:
    needs: python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR, main only
    strategy:
      matrix:
        service: [generator, ingest, risk, gateway]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ledgerlens-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ledgerlens-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
