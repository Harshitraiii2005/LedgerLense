# Local stack. Profiles keep RAM use down: `core` = Kafka + Mongo + generator + ingest.
# More profiles (ai, spark, ui) are added in later phases.
name: ledgerlens

x-kafka-image: &kafka-image apache/kafka:3.9.1

services:
  kafka:
    image: *kafka-image
    profiles: [core]
    ports: ["9092:9092"]
    environment:
      # Single-node KRaft (no ZooKeeper). Two listeners: `kafka:29092` for containers,
      # `localhost:9092` for tools running on the host.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are created explicitly by kafka-init
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: *kafka-image
    profiles: [core]
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in transactions.raw transactions.validated transactions.dlq transactions.flagged; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$t" --partitions 6 --replication-factor 1
        done

  mongo:
    image: mongo:8.0.34
    profiles: [core]
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?copy .env.example to .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?copy .env.example to .env}
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    build: { context: ., args: { SERVICE: ingest } }
    image: ledgerlens/ingest:dev
    profiles: [core]
    ports: ["8000:8000"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 10s
      timeout: 5s
      retries: 10

  generator:
    build: { context: ., args: { SERVICE: generator } }
    image: ledgerlens/generator:dev
    profiles: [core]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      GEN_RATE_PER_SEC: ${GEN_RATE_PER_SEC:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  gateway:
    build: { context: ., args: { SERVICE: gateway } }
    image: ledgerlens/gateway:dev
    profiles: [core]
    ports: ["8002:8002"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      RISK_URL: http://risk:8001
      AGENT_URL: http://agent:8003
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      DEV_MODE: "true" # enables POST /dev/token for the local dashboard login
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      ingest: { condition: service_healthy }
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready')"
      interval: 10s
      timeout: 5s
      retries: 10

  couchbase:
    image: couchbase/server:community-8.0.0
    profiles: [core]
    ports: ["8091:8091"] # web console only; services talk to it over the compose network
    volumes: [couchbase-data:/opt/couchbase/var]
    healthcheck:
      test: curl -sf http://localhost:8091/ui/index.html > /dev/null
      interval: 5s
      timeout: 5s
      retries: 30

  couchbase-init:
    image: couchbase/server:community-8.0.0
    profiles: [core]
    depends_on: { couchbase: { condition: service_healthy } }
    volumes: [./services/risk/couchbase-init.sh:/init.sh:ro]
    environment:
      CB_HOST: couchbase
      CB_USER: ${COUCHBASE_USER:?copy .env.example to .env}
      CB_PASSWORD: ${COUCHBASE_PASSWORD:?copy .env.example to .env}
    entrypoint: ["sh", "/init.sh"]

  risk:
    build: { context: ., args: { SERVICE: risk } }
    image: ledgerlens/risk:dev
    profiles: [core]
    ports: ["8001:8001"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      COUCHBASE_URL: couchbase://couchbase
      COUCHBASE_USER: ${COUCHBASE_USER}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD}
      # Rule thresholds (validated at startup; an invalid value stops the service with exit 78).
      RISK_FLAG_THRESHOLD: ${RISK_FLAG_THRESHOLD:-50}
      RISK_VELOCITY_WINDOW_S: ${RISK_VELOCITY_WINDOW_S:-20}
      RISK_VELOCITY_MAX_TXNS: ${RISK_VELOCITY_MAX_TXNS:-5}
      RISK_ZSCORE_THRESHOLD: ${RISK_ZSCORE_THRESHOLD:-3.5}
      RISK_ZSCORE_MIN_HISTORY: ${RISK_ZSCORE_MIN_HISTORY:-10}
      RISK_COUNTRY_WINDOW_S: ${RISK_COUNTRY_WINDOW_S:-7200}
      RISK_WEIGHT_VELOCITY: ${RISK_WEIGHT_VELOCITY:-50}
      RISK_WEIGHT_AMOUNT: ${RISK_WEIGHT_AMOUNT:-60}
      RISK_WEIGHT_COUNTRY: ${RISK_WEIGHT_COUNTRY:-70}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      couchbase-init: { condition: service_completed_successfully }
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"
      interval: 10s
      timeout: 5s
      retries: 12

  # Angular dashboard behind nginx, which also proxies /api (incl. the WebSocket) to the gateway.
  # Needs the gateway from `core`: PROFILES="core ui" make up
  frontend:
    build: { context: ./frontend }
    image: ledgerlens/frontend:dev
    profiles: [ui]
    ports: ["4200:8080"]
    environment:
      GATEWAY_URL: http://gateway:8002
    depends_on:
      gateway: { condition: service_healthy }

  # Run-once nightly batch (`make spark`). In Kubernetes the same image runs as a CronJob.
  spark-aggregates:
    build: { context: jobs/spark_aggregates, target: runtime }
    image: ledgerlens/spark-aggregates:dev
    profiles: [spark]
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ledgerlens
    mem_limit: 2g
    depends_on:
      mongo: { condition: service_healthy }

  # Query agent. Needs the FAISS index on the host first: `make semantic-index`.
  agent:
    build: { context: ., args: { SERVICE: agent } }
    image: ledgerlens/agent:dev
    profiles: [ai]
    ports: ["8003:8003"]
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      # The catalog and the index built from it travel together (the index checks the catalog hash).
      SEMANTIC_CATALOG_PATH: /semantic/catalog.yaml
      SEMANTIC_INDEX_DIR: /semantic/index
      HF_HOME: /hf-cache
      AGENT_MODEL: ${AGENT_MODEL:-gemini-flash-latest}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: [./semantic:/semantic:ro, hf-cache:/hf-cache]
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongo-data:
  couchbase-data:
  hf-cache:
