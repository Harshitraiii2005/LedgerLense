[project]
name = "ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["ledgerlens-common", "aiokafka==0.15.0", "fastapi==0.162.0", "uvicorn==0.54.0", "motor==3.7.1"]

[project.scripts]
ingest = "ingest.app:run"

[tool.uv.sources]
ledgerlens-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
