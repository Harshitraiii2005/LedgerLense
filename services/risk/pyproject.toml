[project]
name = "risk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ledgerlens-common",
    "aiokafka==0.15.0",
    "couchbase==4.6.4",
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "pymongo==4.19.0",
]

[project.scripts]
risk = "risk.app:run"

[tool.uv.sources]
ledgerlens-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
