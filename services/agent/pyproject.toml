[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ledgerlens-common",
    "ledgerlens-semantic",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "motor==3.7.1",
    "google-adk==2.13.0",
    "anthropic==2.3.0",
    "litellm==1.106.6",  # OpenAI models for the ADK planner, via LiteLlm
]

[project.scripts]
agent = "agent.app:run"

[tool.uv.sources]
ledgerlens-common = { workspace = true }
ledgerlens-semantic = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
