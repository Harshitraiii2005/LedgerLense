[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# websockets: uvicorn's WebSocket protocol implementation (for /v2/ws/flagged)
dependencies = [
    "ledgerlens-common", "aiokafka==0.15.0", "fastapi==0.162.0", "uvicorn==0.54.0",
    "websockets==17.3", "motor==3.7.1", "httpx==0.28.1", "pyjwt==2.15.1",
]

[project.scripts]
gateway = "gateway.app:run"

[tool.uv.sources]
ledgerlens-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
