{{- if .Values.mongo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: ledgerlens }
spec:
  selector: { app.kubernetes.io/name: mongo }
  ports:
    - { name: mongo, port: 27017, targetPort: 27017 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: ledgerlens }
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mongo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongo, app.kubernetes.io/part-of: ledgerlens }
    spec:
      securityContext:
        # The official image starts as root and drops to the mongodb user (999) itself;
        # running it as 999 from the start works too and keeps the pod non-root.
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          imagePullPolicy: IfNotPresent
          args: ["--wiredTigerCacheSizeGB", {{ .Values.mongo.wiredTigerCacheGB | quote }}]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.global.secretName }}, key: MONGO_ROOT_USER } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.global.secretName }}, key: MONGO_ROOT_PASSWORD } }
          ports:
            - { name: mongo, containerPort: 27017 }
          readinessProbe:
            tcpSocket: { port: mongo }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: mongo }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.mongo.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data/db }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.mongo.storage }} } }
{{- end }}
