apiVersion: v2
name: ledgerlens
description: "Umbrella chart: every LedgerLens service plus (optional) in-cluster Kafka, MongoDB and Couchbase."
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - { name: infra, version: 0.1.0, repository: file://../infra, condition: infra.enabled }
  - { name: ingest, version: 0.1.0, repository: file://../ingest, condition: ingest.enabled }
  - { name: generator, version: 0.1.0, repository: file://../generator, condition: generator.enabled }
  - { name: risk, version: 0.1.0, repository: file://../risk, condition: risk.enabled }
  - { name: gateway, version: 0.1.0, repository: file://../gateway, condition: gateway.enabled }
  - { name: agent, version: 0.1.0, repository: file://../agent, condition: agent.enabled }
  - { name: frontend, version: 0.1.0, repository: file://../frontend, condition: frontend.enabled }
  - name: spark-aggregates
    version: 0.1.0
    repository: file://../spark-aggregates
    condition: spark-aggregates.enabled
